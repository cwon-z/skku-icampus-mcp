[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skku-icampus"
version = "0.1.0"
description = "Collects your SKKU iCampus data and serves it over a REST API and an MCP server."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "mcp>=2,<3",
    "playwright==1.61.0",
    "beautifulsoup4>=4.12",
    "pyjwt[crypto]>=2.10.1",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
icampus = "icampus.cli:main"
icampus-mcp = "icampus.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/icampus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
