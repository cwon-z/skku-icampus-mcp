{% extends "base.html" %}
{% from "_ui.html" import mark with context %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<main class="solo">
  <section class="card">
    <span class="lockup">{{ mark() }}<b>iCampus</b></span>
    <div class="stack stack--sm">
      <h1 class="h1 h1--long">{{ title }}</h1>
      <p class="muted">{{ message }}</p>
    </div>
    <div class="row"><a class="btn btn-secondary" href="/admin/">Back to the overview{{ icon("arrow-right", 18, 1.8) }}</a></div>
  </section>
</main>
{% endblock %}
